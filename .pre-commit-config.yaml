---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      # Every Python check CI runs, whenever a .py file is committed. Needs
      # the tools installed: python3 -m pip install -r requirements-dev.txt
      - id: lint-python
        name: lint python
        entry: ./scripts/lint-python.sh
        language: script
        pass_filenames: false
        files: \.py$

      # The rest run on push rather than on every commit.
      # Enable with: pre-commit install --hook-type pre-push
      - id: pytest
        name: pytest
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-push]

      # Catalog consistency and banned-scaffolding checks; walks every agent
      # file.
      - id: validate-catalog
        name: validate catalog
        entry: ./scripts/validate-catalog.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
