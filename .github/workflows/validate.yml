name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# content-lint-tests gates validate: validate-catalog.sh runs the Python
# content lint, and a lint whose own tests fail gives verdicts nobody should
# act on. plugin-schema and enforced-markdown don't run that code, so they
# start straight away rather than waiting behind it.
jobs:
  validate:
    name: Catalog consistency
    needs: content-lint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Nothing here pushes; don't leave the token in .git/config
          persist-credentials: false

      - name: Validate catalog
        run: ./scripts/validate-catalog.sh

  content-lint-tests:
    name: Content lint unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Nothing here pushes; don't leave the token in .git/config
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The scripts themselves need only the standard library. Pinned so a
      # pytest release can't change what passes; bump deliberately.
      - name: Install pytest
        run: python -m pip install pytest==9.1.1

      # tests/ covers every scripts/*.py the lint and stamper use;
      # pyproject.toml configures the run.
      - name: Run tests
        run: python -m pytest

  plugin-schema:
    name: Plugin manifest schema (claude plugin validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Nothing here pushes; don't leave the token in .git/config
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # Needs no ANTHROPIC_API_KEY or login: checked for #318 by running it
      # with an empty HOME and config directory. Pinned to an exact version so
      # a CLI release can't change what --strict rejects; bump deliberately.
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.283

      # Checks .claude-plugin/marketplace.json and each category's
      # plugin.json against Claude Code's own schema: dangling agent paths,
      # unknown or missing manifest fields. It doesn't read agent
      # frontmatter; scripts/validate-catalog.sh does.
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict

  enforced-markdown:
    name: markdownlint/cspell, blocking for ratcheted categories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Nothing here pushes; don't leave the token in .git/config
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # MegaLinter runs markdownlint and cspell report-only across the
      # catalog. This makes them blocking for the categories listed in
      # scripts/lint-enforced-categories.txt, and does nothing while it's empty.
      - name: markdownlint and cspell for ratcheted categories
        run: ./scripts/lint-enforced-markdown.sh
